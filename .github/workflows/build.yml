name: Build PEX Skate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/setup-wasi-sdk-action@v1
        with:
          version: "27"
      - name: Configure C compiler for the WASI target
        run: |
          echo "CC_wasm32_wasip2=$WASI_SDK_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip2=--sysroot=$WASI_SDK_PATH/share/wasi-sysroot" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Test server physics and plugin API integration
        run: cargo test --locked
      - name: Build PEX plugin component
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Build Fabric client companion
        working-directory: client
        run: bash ./gradlew build
      - name: Assemble release files
        run: |
          mkdir -p dist
          cp target/wasm32-wasip2/release/pex_skate.wasm dist/pex-skate.wasm
          client_jar=$(find client/build/libs -maxdepth 1 -type f -name 'pex-skate-client-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$client_jar"
          cp "$client_jar" dist/pex-skate-client-26.3.jar
          sha256sum dist/pex-skate.wasm dist/pex-skate-client-26.3.jar > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: pex-skate-26.3
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pex-skate-26.3
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
