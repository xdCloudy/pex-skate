name: Build PEX Skate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Test server physics and plugin API integration
        run: cargo test --locked
      - name: Build PEX plugin component
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Build Fabric client companion
        working-directory: client
        run: bash ./gradlew build
      - name: Assemble release files
        run: |
          mkdir -p dist
          cp target/wasm32-wasip2/release/pex_skate.wasm dist/pex-skate.wasm
          cp client/build/libs/pex-skate-client-0.1.0-alpha.2.jar dist/pex-skate-client-26.3.jar
      - uses: actions/upload-artifact@v7
        with:
          name: pex-skate-26.3
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pex-skate-26.3
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
