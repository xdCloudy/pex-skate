name: Build PEX Skate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/setup-wasi-sdk-action@v1
        with:
          version: "27"
          add-to-path: false
      - name: Configure C compiler for the WASI target
        run: |
          echo "CC_wasm32_wasip2=$WASI_SDK_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip2=--sysroot=$WASI_SDK_PATH/share/wasi-sysroot" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Test server physics and plugin API integration
        run: cargo test --locked
      - name: Build PEX plugin component
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Smoke test plugin in the pinned PEX server runtime
        run: bash ./tools/smoke-test-pex-runtime.sh target/wasm32-wasip2/release/pex_skate.wasm
      - name: Build Fabric client companion
        working-directory: client
        run: bash ./gradlew build
      - name: Assemble release files
        run: |
          mkdir -p dist
          cp target/wasm32-wasip2/release/pex_skate.wasm dist/pex-skate.wasm
          client_jar=$(find client/build/libs -maxdepth 1 -type f -name 'pex-skate-client-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$client_jar"
          cp "$client_jar" dist/pex-skate-client-26.3.jar
          cp release/INSTALL.md dist/INSTALL.md
          cp LICENSE vendor/NOTICE.md dist/
          cp vendor/pumpkin-plugin-api/LICENSE-APACHE dist/LICENSE-PEX-API-APACHE
          cp vendor/pumpkin-plugin-api/LICENSE-MIT dist/LICENSE-PEX-API-MIT
          cp vendor/pumpkin-plugin-wit/LICENSE-PEX dist/LICENSE-PEX-WIT
          cp vendor/skate-engine/LICENSE dist/LICENSE-SKATE-ENGINE
          cp vendor/skate-engine/NOTICE-mashup dist/NOTICE-SKATE-ENGINE
          (cd dist && sha256sum pex-skate.wasm pex-skate-client-26.3.jar > SHA256SUMS)
          (cd dist && zip -j PEX-Skate-26.3.zip pex-skate.wasm pex-skate-client-26.3.jar SHA256SUMS INSTALL.md LICENSE NOTICE.md LICENSE-PEX-API-APACHE LICENSE-PEX-API-MIT LICENSE-PEX-WIT LICENSE-SKATE-ENGINE NOTICE-SKATE-ENGINE)
          (cd dist && sha256sum --check SHA256SUMS)
          expected_entries=$(printf '%s\n' INSTALL.md LICENSE NOTICE.md SHA256SUMS LICENSE-PEX-API-APACHE LICENSE-PEX-API-MIT LICENSE-PEX-WIT LICENSE-SKATE-ENGINE NOTICE-SKATE-ENGINE pex-skate-client-26.3.jar pex-skate.wasm | LC_ALL=C sort)
          actual_entries=$(unzip -Z1 dist/PEX-Skate-26.3.zip | LC_ALL=C sort)
          diff -u <(printf '%s\n' "$expected_entries") <(printf '%s\n' "$actual_entries")
      - uses: actions/upload-artifact@v7
        with:
          name: pex-skate-26.3
          path: dist/*
  windows-data-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install converter build requirements
        run: python -m pip install -r tools/skategm-exporter/tools/requirements-setup.txt
      - name: Test XDVDFS ISO reader with synthetic images
        run: python -m unittest discover -s tools/skategm-exporter/tests -v
      - name: Build portable Skate 3 ISO converter
        shell: pwsh
        run: ./tools/skategm-exporter/build.ps1 -Out "$env:GITHUB_WORKSPACE\setup-build"
      - name: Package ISO setup helper
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "setup-package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\setup-build\skategm-convert.exe" $package
          Copy-Item "$env:GITHUB_WORKSPACE\setup-build\skategm-exporter-source.zip" $package
          Copy-Item tools/Install-PEXSkateData.ps1 $package
          Copy-Item tools/Install-PEXSkateData.bat $package
          Copy-Item LICENSE $package
          Copy-Item tools/skategm-exporter/LICENSE-THIRD-PARTY.md $package
          Copy-Item tools/skategm-exporter/UPSTREAM.md $package
          $hashes = @("skategm-convert.exe", "skategm-exporter-source.zip") | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath (Join-Path $package $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          Set-Content -LiteralPath (Join-Path $package "SHA256SUMS") -Value $hashes -Encoding ascii
          Compress-Archive -Path "$package\*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "PEX-Skate-ISO-Setup-Windows.zip")
      - uses: actions/upload-artifact@v7
        with:
          name: pex-skate-iso-setup-windows
          path: PEX-Skate-ISO-Setup-Windows.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-data-setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pex-skate-26.3
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: pex-skate-iso-setup-windows
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
