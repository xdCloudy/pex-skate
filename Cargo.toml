[package]
name = "pex-skate"
version = "0.1.0-alpha.80"
edition = "2024"
publish = false
description = "A portable PEX server plugin for the experimental PEX Skate client/server bridge."
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { path = "vendor/pumpkin-plugin-api" }
skate-host = { path = "vendor/skate-engine/crates/skate-host" }
skate-data = { path = "vendor/skate-engine/crates/skate-data" }

[package.metadata.component]
package = "pexskate:server"

