plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.version
group = project.group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "pexskate" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly "org.lwjgl:lwjgl-sdl:3.4.3"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileClientJava')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (providers.environmentVariable("PEX_SKATE_INTEGRATION_MAP").isPresent()) {
        maxHeapSize = "4G"
    }
}

def modVersion = project.version.toString()
processResources {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("../LICENSE") {
        rename { "${it}_pex-skate" }
    }
}
