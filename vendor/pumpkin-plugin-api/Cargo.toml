[package]
name = "pumpkin-plugin-api"
version = "0.2.0+26.3-26.51"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pinned PEX/Pumpkin plugin API vendored for an independent mod build"

[dependencies]
wit-bindgen = { version = "0.62", default-features = false, features = ["macros"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
tracing-serde-structured = { version = "0.4", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[package.metadata.component]
target = { path = "../pumpkin-plugin-wit" }
